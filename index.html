
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZXPZCS AVIATOR</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <div class="brand">🚀 ZXPZCS <span>AVIATOR</span></div>
    <div class="profile">👤 PLAYER</div>
  </header>

  <div class="tabs">
    <button class="active">CLASSIC</button>
    <button>FAST</button>
  </div>

  <section class="game">
    <div class="top-info">
      <span>FLIGHT SCORE</span>
      <span id="status">WAITING FOR FLIGHT</span>
    </div>

    <div class="multiplier" id="multiplier">1.00x</div>

    <div class="sky">
      <div class="stars"></div>
      <div class="curve"></div>
      <div id="plane">🚀</div>
      <div class="cloud cloud1">☁</div>
      <div class="cloud cloud2">☁</div>
      <div class="cloud cloud3">☁</div>
    </div>

    <div class="history-title">RECENT FLIGHT SCORES</div>
    <div id="history" class="history">
      <span>READY</span>
    </div>
  </section>

  <section class="controls">
    <div class="mode">
      <button class="selected">MANUAL</button>
      <button>AUTO</button>
    </div>

    <div class="score-card">
      <span>PERSONAL BEST</span>
      <strong id="best">0.00x</strong>
    </div>

    <button id="play" class="main-btn">START FLIGHT</button>
    <button id="saveScore" class="save-btn" disabled>SAVE FLIGHT SCORE</button>
    <p class="notice">Demo flight simulator · No real-money wagering</p>
  </section>

  <script src="/app.js"></script>
</body>
</html>
